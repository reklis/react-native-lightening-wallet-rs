[package]
name = "reactnative-lightening-wallet"
version = "0.1.28"
edition = "2021"
authors = ["Element FM"]
license = "MIT"

[lib]
name = "reactnative_lightening_wallet"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# LDK Node - High-level Lightning implementation
ldk-node = "0.6.2"

# Bitcoin & BIP39
bitcoin = { version = "0.31", features = ["serde"] }
bip39 = "2.0"

# Electrum
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-native-certs = "0.6"
webpki-roots = "0.25"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Async Runtime
tokio = { version = "1.36", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
lazy_static = "1.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rand = "0.8"

# Logging
log = "0.4"

# Platform bindings
jni = { version = "0.21", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
